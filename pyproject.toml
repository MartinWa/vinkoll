[project]
name = "vinkoll"
version = "0.1.0"
description = "A shared, self-hosted wine cellar"
requires-python = ">=3.14,<3.15"
dependencies = [
    "Django==5.2.18",
    "pillow==12.2.0",
    "pillow-heif==1.8.1",
    "tzdata==2026.6",
    "waitress==3.0.2",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-django==4.14.0", "ruff==0.17.4"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "vinkoll.settings.test"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
