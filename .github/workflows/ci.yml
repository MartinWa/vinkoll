name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "19 5 * * 1"

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Keep aligned with the uv-bin digest in the Dockerfile.
  UV_VERSION: "0.13.7"
  DOCKER_BUILD_RECORD_UPLOAD: "false"

jobs:
  checks:
    name: Checks (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Verify the dependency lockfile
        run: uv lock --check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build development and test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: development
          load: true
          push: false
          provenance: false
          tags: vinkoll:ci-dev
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha,scope=ci-development
          cache-to: type=gha,scope=ci-development,mode=max
          github-token: ""
      - name: Lint and check formatting
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /data:uid=1000,gid=1000 --tmpfs /tmp \
            vinkoll:ci-dev python -m ruff check .
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /data:uid=1000,gid=1000 --tmpfs /tmp \
            vinkoll:ci-dev python -m ruff format --check .
      - name: Check migrations and run database tests
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /data:uid=1000,gid=1000 --tmpfs /tmp \
            vinkoll:ci-dev python manage.py makemigrations --check --dry-run
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /data:uid=1000,gid=1000 --tmpfs /tmp \
            vinkoll:ci-dev python -m pytest

  container:
    name: Container (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow syntax
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' \
            "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: Set up uv for dependency auditing
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Audit locked Python dependencies
        run: |
          uv export --locked --no-emit-project --format requirements-txt \
            --output-file "$RUNNER_TEMP/audit-requirements.txt" > /dev/null
          uvx --python 3.14 --from pip-audit==2.10.1 pip-audit --disable-pip --strict \
            --progress-spinner off -r "$RUNNER_TEMP/audit-requirements.txt"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build production image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: production
          load: true
          push: false
          provenance: false
          tags: vinkoll:ci
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          cache-from: type=gha,scope=ci-production
          cache-to: type=gha,scope=ci-production,mode=max
          github-token: ""
      - name: Run the production HTTP and persistence smoke test
        # tools/ files use the Python 3.14 PEP 758 except syntax that the
        # formatter enforces; the runner's default Python is older.
        run: uv run --no-project --python 3.14.10 python tools/smoke.py vinkoll:ci
